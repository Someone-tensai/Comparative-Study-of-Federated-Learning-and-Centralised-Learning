[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demo"
version = "1.2.2"
description = "Federated Learning with Numpy and Flower (Demo)"
# Dependencies for your Flower App
dependencies = [
    "flwr[simulation]>=1.28.0",
    "numpy>=2.0.2",
]
[tool.flwr.app]
publisher = "same_param_training"

[tool.hatch.build.targets.wheel]
packages = ["."]

# Point to your ServerApp and ClientApp objects
# Format: "<module>:<object>"
[tool.flwr.app.components]
serverapp = "same_param_training.server_app:app"
clientapp = "same_param_training.client_app:app"

# Custom config values accessible via `context.run_config`
[tool.flwr.app.config]
num-server-rounds = 20
model-name = "resnet18"
freeze-backbone = true


